services:
  # ----------------------------------------
  # 1. Backend Service (FastAPI)
  # ----------------------------------------
  - type: web
    name: spectra-ai-backend
    env: python
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in Render dashboard
      # Add other necessary backend environment variables here
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # Set this to your frontend URL (e.g., https://spectra-ai-frontend.onrender.com) once it's created.
      - key: PYTHON_VERSION
        value: "3.11.0"
  # ----------------------------------------
  # 2. Frontend Service (Next.js)
  # ----------------------------------------
  - type: web
    name: spectra-ai-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set this to https://spectra-ai-backend.onrender.com
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
